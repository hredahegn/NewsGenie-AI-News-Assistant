<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2F73F2">
  <meta name="description" content="Haddish Signal — AI-powered news intelligence and source-aware information.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Haddish Signal">
  <title>Haddish Signal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/haddish-signal.svg">
  <link rel="apple-touch-icon" href="./icons/haddish-signal.svg">
  <style>
    :root { color-scheme: light; --bg:#f8fbff; --ink:#14263d; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); overflow:hidden; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { position:fixed; inset:0; background:radial-gradient(circle at 8% 8%,rgba(0,174,202,.12),transparent 30%),radial-gradient(circle at 92% 10%,rgba(118,88,232,.11),transparent 28%),linear-gradient(145deg,#fbfdff 0%,#eef8fc 55%,#fff 100%); }
    iframe { display:block; width:100%; height:100dvh; border:0; background:transparent; }
    .loader { position:absolute; inset:0; display:grid; place-items:center; z-index:3; background:var(--bg); transition:opacity .28s ease,visibility .28s ease; }
    .loader.hide { opacity:0; visibility:hidden; }
    .brand { text-align:center; color:var(--ink); }
    .mark { width:92px; height:92px; border-radius:28px; box-shadow:0 18px 60px rgba(47,115,242,.18); margin:0 auto 18px; }
    .brand strong { display:block; font-size:1.45rem; letter-spacing:-.02em; }
    .brand span { display:block; margin-top:6px; color:#60738a; font-size:.9rem; }
    .offline { position:absolute; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:5; display:none; padding:10px 14px; border-radius:999px; background:#14263d; color:#fff; font-size:.82rem; box-shadow:0 8px 24px rgba(20,38,61,.18); white-space:nowrap; }
    .offline.show { display:block; }
  </style>
</head>
<body>
  <main class="shell" aria-label="Haddish Signal">
    <div id="loader" class="loader"><div class="brand"><img class="mark" src="./icons/haddish-signal.svg" alt=""><strong>Haddish Signal</strong><span>Opening live intelligence workspace…</span></div></div>
    <div id="offline" class="offline">You’re offline — reconnect to load live news.</div>
    <iframe id="app" title="Haddish Signal" src="https://newsgenie-hredahegn.streamlit.app/?embed=true&embed_options=light_theme&hs_build=livefreshness2" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script>
    const loader=document.getElementById('loader'),frame=document.getElementById('app'),offline=document.getElementById('offline');
    frame.addEventListener('load',()=>loader.classList.add('hide'));
    setTimeout(()=>loader.classList.add('hide'),12000);
    function updateNetworkState(){offline.classList.toggle('show',!navigator.onLine)}
    window.addEventListener('online',updateNetworkState); window.addEventListener('offline',updateNetworkState); updateNetworkState();
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
  </script>
</body>
</html>
