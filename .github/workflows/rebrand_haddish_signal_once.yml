name: Rebrand to Haddish Signal

on:
  push:
    paths:
      - '.github/workflows/rebrand_haddish_signal_once.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Haddish Signal branding
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new)
              p.write_text(text)

          replace_all('app.py', [
              ('page_title="NewsGenie | Haddish Redahegn"', 'page_title="Haddish Signal | AI News Intelligence"'),
              ('page_icon="📰"', 'page_icon="assets/haddish_signal_icon.svg"'),
              ('<div class="ng-sidebar-logo">📰 NewsGenie</div>', '<div class="ng-sidebar-logo">◉ Haddish Signal</div>'),
              ('<h1 class="ng-title">News<span>Genie</span></h1>', '<h1 class="ng-title">Haddish<span> Signal</span></h1>'),
              ('NewsGenie is running in source-first mode.', 'Haddish Signal is running in source-first mode.'),
              ('NewsGenie used its fallback path where possible.', 'Haddish Signal used its fallback path where possible.'),
              ("NewsGenie · Designed and developed by", "Haddish Signal · Designed and developed by"),
          ])

          replace_all('newsgenie/llm.py', [
              ('You route requests for NewsGenie.', 'You route requests for Haddish Signal.'),
              ('You are NewsGenie, a careful news assistant.', 'You are Haddish Signal, a careful news assistant.'),
              ('You are NewsGenie, a concise information assistant.', 'You are Haddish Signal, a concise information assistant.'),
          ])

          replace_all('newsgenie/news_service.py', [
              ('NewsGenie/1.0', 'HaddishSignal/1.0'),
          ])
          PY
      - name: Validate Python
        run: |
          python -m py_compile app.py newsgenie/llm.py newsgenie/news_service.py
          python - <<'PY'
          from pathlib import Path
          assert Path('assets/haddish_signal_icon.svg').exists()
          text = Path('app.py').read_text()
          assert 'Haddish Signal' in text
          assert 'assets/haddish_signal_icon.svg' in text
          print('Haddish Signal branding validated')
          PY
      - name: Commit rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py newsgenie/llm.py newsgenie/news_service.py
          git commit -m "Rebrand NewsGenie as Haddish Signal"
          git push
