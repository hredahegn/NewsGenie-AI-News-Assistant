name: Apply bright NewsGenie UI

on:
  push:
    paths:
      - '.github/workflows/apply_bright_ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bright 3D UI
        run: python scripts/apply_bright_ui.py
      - name: Commit UI update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "Brighten NewsGenie with crisp 3D glass interface"
            git push
          fi
