name: Add Politics category

on:
  push:
    paths:
      - '.github/workflows/add_politics_once.yml'

permissions:
  contents: write

jobs:
  add-politics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add politics across NewsGenie
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          # UI: sidebar category + Live News category
          replace_once(
              'app.py',
              '["auto", "technology", "finance", "sports"]',
              '["auto", "technology", "finance", "sports", "politics"]',
          )
          replace_once(
              'app.py',
              '["technology", "finance", "sports"]',
              '["technology", "finance", "sports", "politics"]',
          )
          replace_once(
              'app.py',
              '        for item in SAMPLE_NEWS[selected]:\n',
              '        samples = SAMPLE_NEWS.get(selected, [])\n'
              '        if not samples:\n'
              '            st.caption("Politics is configured for live retrieval. Click Refresh live news to fetch current headlines.")\n'
              '        for item in samples:\n',
          )

          # News retrieval: Google News RSS + future NewsAPI support
          replace_once(
              'newsgenie/news_service.py',
              '    "sports": "sports",\n    "general": "general",',
              '    "sports": "sports",\n    "politics": "general",\n    "general": "general",',
          )
          replace_once(
              'newsgenie/news_service.py',
              '    "sports": "sports",\n    "general": "top news",',
              '    "sports": "sports",\n    "politics": "politics government elections congress White House",\n    "general": "top news",',
          )
          replace_once(
              'newsgenie/news_service.py',
              '        if query:\n            params["q"] = query[:200]\n',
              '        if query:\n            params["q"] = query[:200]\n        elif category == "politics":\n            params["q"] = "politics government elections congress White House"\n',
          )

          # Assistant classifier: manual selection, LLM schema, validation, and key-free routing
          replace_once(
              'newsgenie/llm.py',
              '        if selected in {"technology", "finance", "sports"}:',
              '        if selected in {"technology", "finance", "sports", "politics"}:',
          )
          replace_once(
              'newsgenie/llm.py',
              'category must be one of \\"technology\\", \\"finance\\", \\"sports\\", \\"general\\".',
              'category must be one of \\"technology\\", \\"finance\\", \\"sports\\", \\"politics\\", \\"general\\".',
          )
          replace_once(
              'newsgenie/llm.py',
              'category in {"technology", "finance", "sports", "general"}',
              'category in {"technology", "finance", "sports", "politics", "general"}',
          )
          replace_once(
              'newsgenie/llm.py',
              '        elif any(w in q for w in ["sports", "sport", "football", "soccer", "nba", "nfl", "mlb", "wnba", "tennis", "cricket"]):\n            category = "sports"\n',
              '        elif any(w in q for w in ["sports", "sport", "football", "soccer", "nba", "nfl", "mlb", "wnba", "tennis", "cricket"]):\n            category = "sports"\n        elif any(w in q for w in ["politics", "political", "election", "elections", "president", "congress", "senate", "house", "government", "white house", "campaign", "vote", "voting", "democrat", "republican"]):\n            category = "politics"\n',
          )

          # Test the new route explicitly
          p = Path('tests/test_core.py')
          text = p.read_text()
          marker = '\n\ndef test_rule_based_general_routing():'
          politics_test = '''\n\ndef test_rule_based_politics_routing():\n    llm = LLMService(api_key=None)\n    result = llm.classify("Give me the latest politics news")\n    assert result == {"route": "news", "category": "politics"}\n'''
          if marker not in text:
              raise SystemExit('Could not locate test insertion point')
          p.write_text(text.replace(marker, politics_test + marker, 1))
          PY
      - name: Install test dependencies
        run: pip install -q pytest
      - name: Run tests
        run: pytest -q
      - name: Commit Politics support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py newsgenie/news_service.py newsgenie/llm.py tests/test_core.py
          git commit -m "Add Politics as a first-class NewsGenie category"
          git push
